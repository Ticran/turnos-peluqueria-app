spring.application.name=app-peluqueria

# Credenciales y secretos van en backend/application-local.properties (no se sube a git)
# o en variables de entorno. Ver application-local.properties.example
spring.config.import=optional:file:./application-local.properties,optional:file:./backend/application-local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/turnosapp_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# Datos de demo (usuarios con contraseñas públicas): solo en local con app.demo-data=true. Ver V9
spring.flyway.placeholders.demo_data=${app.demo-data:false}

# Obligatorio, mínimo 32 caracteres (sin esto la app no arranca)
jwt.secret=${JWT_SECRET:}

# Dueño de la plataforma (SUPER_ADMIN): se crea al arrancar si no existe ninguno
app.platform-owner.email=${PLATFORM_OWNER_EMAIL:}
app.platform-owner.password=${PLATFORM_OWNER_PASSWORD:}

# Orígenes permitidos para llamar a la API, separados por coma (ej. https://turnos.midominio.com)
app.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Fotos de perfil y portada
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# URL del frontend (links de los emails) y del backend (fotos guardadas en disco)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.public-url=${PUBLIC_URL:http://localhost:8080}
